<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO Meta Tags -->
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <meta name="description" content="{% block meta_description %}The Steward's Watch provides professional, owner-operated house sitting services across Putnam and Dutchess Counties, NY. Home security, pet care, plant maintenance, and more.{% endblock %}">

    <!-- Open Graph / Social Media Tags -->
    <meta property="og:title" content="{% block og_title %}The Steward's Watch - Professional House Sitting{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Owner-operated house sitting in Putnam &amp; Dutchess Counties, NY. Your home cared for while you're away.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://thestewardswatch.com">
    <meta property="og:image" content="https://thestewardswatch.com/static/images/logo.png">

    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  </head>
  <body>
    <header>
      <div class="container">
	<div class="logo-container">
	  <img src="/static/images/logo.svg" alt="The Steward's Watch - Professional House Sitting" class="logo">
	</div>
	<nav class="main-nav">
	  <ul>
	    <li><a href="/" {% ifequal active "home" %}class="active"{% endifequal %}>Home</a></li>
	    <li><a href="/services" {% ifequal active "services" %}class="active"{% endifequal %}>Services</a></li>
	    <li><a href="/about" {% ifequal active "about" %}class="active"{% endifequal %}>About</a></li>
	    <li><a href="/testimonials" {% ifequal active "testimonials" %}class="active"{% endifequal %}>Testimonials</a></li>
	    <li><a href="/contact" {% ifequal active "contact" %}class="active"{% endifequal %}>Contact</a></li>
	  </ul>
	</nav>
      </div>
    </header>
    <main class="container">
      {% block content %}{% endblock %}
    </main>
    <footer>
      <div class="container">
	<div class="footer-content">
	  <div class="footer-info">
	    <p class="footer-brand">&copy; {{ now }} The Steward's Watch LLC</p>
	    <p class="footer-contact-line">
	      <a href="tel:+18458031769"><i class="fas fa-phone"></i> (845) 803-1769</a>
	      &nbsp;&bull;&nbsp;
	      <a href="mailto:thestewardswatch@gmail.com"><i class="fas fa-envelope"></i> thestewardswatch@gmail.com</a>
	    </p>
	    <p class="footer-area"><i class="fas fa-map-marker-alt"></i> Serving Putnam &amp; Dutchess Counties, NY</p>
	  </div>
	  <div class="footer-links">
	    <a href="/about">About</a>
	    <a href="/services">Services</a>
	    <a href="/contact">Contact</a>
	  </div>
	</div>
      </div>
    </footer>
    <!-- Schema.org markup for local business -->
    <script type="application/ld+json">
      {
	  "@context": "https://schema.org",
	  "@type": "LocalBusiness",
	  "name": "The Steward's Watch LLC",
	  "url": "https://thestewardswatch.com",
	  "image": "https://thestewardswatch.com/static/images/logo.png",
	  "telephone": "+1-845-803-1769",
	  "email": "thestewardswatch@gmail.com",
	  "address": {
	      "@type": "PostalAddress",
	      "addressLocality": "Kent",
	      "addressRegion": "NY",
	      "addressCountry": "US"
	  },
	  "geo": {
	      "@type": "GeoCoordinates",
	      "latitude": 41.4428,
	      "longitude": -73.7301
	  },
	  "areaServed": [
	      {
		  "@type": "AdministrativeArea",
		  "name": "Putnam County, NY"
	      },
	      {
		  "@type": "AdministrativeArea",
		  "name": "Dutchess County, NY"
	      }
	  ],
	  "priceRange": "$$",
	  "description": "Owner-operated house sitting services in Putnam and Dutchess Counties, NY. Home security, pet care, plant maintenance, and property monitoring."
      }
    </script>
  </body>
</html>
